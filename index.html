const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a);
const G={state:'menu',level:1,score:0,best:0,intro:0,endDelay:0,t:0,result:null};

let grid=[],roofs=[],player,rivals=[],pickups=[],clouds=[],parts=[],popups=[],deco=[],timeLeft=0,coverTotal=0,P={},msg={text:'',life:0,col:'#fff'};
let spawnT={roll:0,gas:0,rain:0};

function levelParams(n){return{rivals:n===1?1:n===2?2:3,sealTime:Math.max(0.5,1.35-0.14*(n-1)),rivalSpeed:72+n*9,
  time:Math.max(70,100-(n-1)*5),rainEvery:Math.max(6,15-n*1.4),cloudSpeed:50+n*9}}
function tileAt(x,y){const c=Math.floor(x/T),r=Math.floor((y-OY)/T);return(grid[r]&&grid[r][c])?grid[r][c]:null}
function coverable(t){return t&&t.roof&&!t.obst}
function tc(c,r){return{x:c*T+T/2,y:OY+r*T+T/2}}

function initLevel(n){
  P=levelParams(n);const L=LAYOUTS[(n-1)%LAYOUTS.length];
  grid=[];for(let r=0;r<ROWS;r++){const row=[];for(let c=0;c<COLS;c++)row.push({c,r,roof:false,obst:0,state:0,owner:-1,heat:0,wet:0,anim:1,v:Math.random()});grid.push(row)}
  roofs=L.roofs.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));
  roofs.forEach(R=>{for(let r=R.y;r<R.y+R.h;r++)for(let c=R.x;c<R.x+R.w;c++)grid[r][c].roof=true});
  L.obst.forEach((o,i)=>{grid[o[1]][o[0]].obst=1+(i%2)});
  coverTotal=0;grid.forEach(row=>row.forEach(t=>{if(coverable(t))coverTotal++}));
  const s=tc(1,13);
  player={x:s.x,y:s.y,dir:{x:1,y:0},rolls:3,rollLeft:0,gas:100,torch:false,walk:0,auto:player?player.auto:true,team:0};
  rivals=[];for(let i=0;i<P.rivals;i++){const p=tc(RIVAL_SPAWN[i][0],RIVAL_SPAWN[i][1]);
    rivals.push({x:p.x,y:p.y,dir:{x:-1,y:0},team:i+1,st:'think',target:null,timer:0,walk:0,torch:false,bubble:'',bubbleT:0})}
  pickups=[];clouds=[];parts=[];popups=[];
  deco=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=grid[r][c];if(!t.roof&&Math.random()<0.09&&!(r===13&&c<3))
    deco.push({x:c*T+rnd(8,32),y:OY+r*T+rnd(8,32),k:Math.random()<0.75?'albero':'vaso',s:rnd(0.7,1.1)})}
  timeLeft=P.time;spawnT={roll:1.5,gas:3,rain:P.rainEvery*0.8};
  for(let i=0;i<2;i++)spawnPickup('roll');
  G.intro=2.2;G.level=n;tutStart(n);
}
function startGame(){G.score=0;player=null;initLevel(1);G.state='play';updateOverlays()}
const TUT={step:-1,t:0,laid:0,sealed:0,gasTip:false};
function tutStart(n){TUT.step=n===1?0:-1;TUT.t=0;TUT.laid=0;TUT.sealed=0;TUT.gasTip=false}
function tutUpdate(dt){
  if(G.level===1&&!TUT.gasTip&&player.gas<25){TUT.gasTip=true;say('Gas quasi finito: prendi una bombola GPL!','#ffd166')}
  if(TUT.step<0)return;TUT.t+=dt;const t=tileAt(player.x,player.y);
  if(TUT.step===0&&t&&t.roof)next();else if(TUT.step===1&&TUT.laid>=3)next();else if(TUT.step===2&&TUT.sealed>=3)next();
  else if(TUT.step===3&&TUT.t>4.5)next();else if(TUT.step===4&&TUT.t>4.5)TUT.step=-1;
  function next(){TUT.step++;TUT.t=0}
}
function tutText(){const tm=touchMode||isTouchDev;switch(TUT.step){
  case 0:return tm?'1/5  Vai sul tetto grigio: muoviti col JOYSTICK':'1/5  Vai sul tetto grigio: muoviti con FRECCE o WASD';
  case 1:return '2/5  Cammina sul tetto: la guaina si stende da sola';
  case 2:return tm?'3/5  Tieni premuto CANNELLO: la guaina diventa nera lucida':'3/5  Tieni premuto SPAZIO: la guaina diventa nera lucida';
  case 3:return '4/5  Ottimo! Raccogli ROTOLI di guaina e BOMBOLE di gas';
  case 4:return '5/5  Sigilla prima della pioggia e batti le ditte rivali!';}return ''}
function drawTutorial(){if(TUT.step<0||G.intro>0||G.state!=='play')return;const s=tutText();ctx.font='bold 19px Verdana';const w=ctx.measureText(s).width+64,y=OY+56;
  const pul=0.6+0.4*Math.sin(G.t*6);ctx.fillStyle='rgba(255,209,102,.95)';rr(W/2-w/2,y,w,40,14);ctx.fill();ctx.strokeStyle='rgba(168,82,0,'+pul+')';ctx.lineWidth=3;ctx.stroke();
  circle(W/2-w/2+22,y+20,12,'#a85200');txt('!',W/2-w/2+22,y+21,17,'#fff','center',0);txt(s,W/2+12,y+21,19,'#1b2530','center',0);
  if(touchMode||isTouchDev){const b=Math.sin(G.t*8)*8;let ax=null,ay=null;
    if(TUT.step===0){ax=130;ay=H-130-JOY_R-40+b}else if(TUT.step===2){ax=BTN_TORCH.x;ay=BTN_TORCH.y-BTN_TORCH.r-30+b}
    if(ax!==null){ctx.fillStyle='#ffd166';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ax,ay+22);ctx.lineTo(ax-18,ay);ctx.lineTo(ax-7,ay);ctx.lineTo(ax-7,ay-20);ctx.lineTo(ax+7,ay-20);ctx.lineTo(ax+7,ay);ctx.lineTo(ax+18,ay);ctx.closePath();ctx.stroke();ctx.fill()}}}

function spawnPickup(type){
  for(let k=0;k<60;k++){const x=rnd(30,W-30),y=rnd(OY+30,OY+ROWS*T-30);const t=tileAt(x,y);
    if(!t||t.obst)continue;if(player&&Math.hypot(x-player.x,y-player.y)<120)continue;
    if(pickups.some(p=>Math.hypot(p.x-x,p.y-y)<60))continue;
    pickups.push({type,x,y,b:Math.random()*6});return}
}

const keys={};let touchMode=false,touchTorch=false,torchId=null,touchLay=false;
const joy={active:false,id:null,bx:130,by:H-130,dx:0,dy:0};
const JOY_R=80,BTN_TORCH={x:W-115,y:H-125,r:84},BTN_AUTO={x:W-282,y:H-62,r:46},BTN_LAY={x:W-282,y:H-200,r:56};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.repeat){keys[e.code]=true;return}
  keys[e.code]=true;audioInit();
  if(e.code==='KeyM'){toggleMute();return}
  if(e.code==='Enter'||(e.code==='Space'&&G.state!=='play'))proceed();
  if(G.state==='play'&&e.code==='KeyR'){player.auto=!player.auto;say('Stesura automatica: '+(player.auto?'ON':'OFF'))}
  if(e.code==='KeyP'||e.code==='Escape'){if(G.state==='play')G.state='pause';else if(G.state==='pause')G.state='play'}
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function proceed(){
  if(G.state==='menu'){if((isTouchDev||touchMode)&&!howtoSeen())openHowto(true);else startGame()}
  else if(G.state==='pause')G.state='play';
  else if(G.state==='levelEnd'&&G.endDelay<=0){
    if(G.result.won){if(G.level>=MAX_LEVEL){G.state='victory';saveBest()}else{initLevel(G.level+1);G.state='play'}}
    else{G.state='gameover';saveBest()}}
  else if((G.state==='gameover'||G.state==='victory')&&G.endDelay<=0)G.state='menu';
}
function saveBest(){G.endDelay=0.8;if(G.score>G.best){G.best=G.score;try{localStorage.setItem('asfaltista_best',G.best)}catch(e){}}}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();if(e.pointerType!=='mouse')touchMode=true;
  const p=toLogical(e);audioInit();
  if(inRect(p,BTN_MUTE)){toggleMute();return}
  if(fsOK&&inRect(p,BTN_FS))return; // gestito su click (serve gesto utente)
  if(G.state==='play'&&inRect(p,BTN_PAUSE)){G.state='pause';return}

function noiseBuf(a,brown){const len=a.sampleRate*2,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(brown){last=(last+0.02*w)/1.02;d[i]=last*3.5}else d[i]=w}return b}
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let a;try{a=new AC()}catch(e){return}AU.ctx=a;
  AU.white=noiseBuf(a,false);AU.brown=noiseBuf(a,true);
  AU.master=a.createGain();AU.master.gain.value=AU.muted?0:0.55;AU.master.connect(a.destination);
  AU.torch=a.createGain();AU.torch.gain.value=0;AU.torch.connect(AU.master);
  // sibilo del gas "fssss"
  const hs=a.createBufferSource();hs.buffer=AU.white;hs.loop=true;
  const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3000;bp.Q.value=0.6;
  const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;
  const hg=a.createGain();hg.gain.value=0.32;hs.connect(hp);hp.connect(bp);bp.connect(hg);hg.connect(AU.torch);AU.hissF=bp;
  // rombo della fiamma
  const rs=a.createBufferSource();rs.buffer=AU.brown;rs.loop=true;
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;lp.Q.value=1.2;
  const rg=a.createGain();rg.gain.value=0.9;rs.connect(lp);lp.connect(rg);rg.connect(AU.torch);AU.roarF=lp;
  // tremolio (flutter)
  const lfo=a.createOscillator();lfo.frequency.value=11;const lg=a.createGain();lg.gain.value=0.25;lfo.connect(lg);lg.connect(rg.gain);
  const lfo2=a.createOscillator();lfo2.frequency.value=5.3;const lg2=a.createGain();lg2.gain.value=350;lfo2.connect(lg2);lg2.connect(bp.frequency);

function torchSound(on){
  if(!AU.ctx||on===AU.on)return;AU.on=on;const a=AU.ctx,t=a.currentTime,g=AU.torch.gain;

  if(on){g.linearRampToValueAtTime(0.18,t+0.05);g.linearRampToValueAtTime(0.5,t+0.25);puff()}
  else g.setTargetAtTime(0,t,0.07);

function puff(){ // "whoomp" di accensione
  const a=AU.ctx,t=a.currentTime;
  const n=a.createBufferSource();n.buffer=AU.brown;const f=a.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(150,t+0.3);
  const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(1.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);

  const o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(38,t+0.25);
  const og=a.createGain();og.gain.setValueAtTime(0.0001,t);og.gain.exponentialRampToValueAtTime(0.5,t+0.015);og.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
  o.connect(og);og.connect(AU.master);o.start(t);o.stop(t+0.32);

function blocked(x,y,rad){
  if(x<rad||x>W-rad||y<OY+rad||y>OY+ROWS*T-rad)return true;
  const c0=Math.floor((x-rad)/T),c1=Math.floor((x+rad)/T),r0=Math.floor((y-OY-rad)/T),r1=Math.floor((y-OY+rad)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const t=grid[r]&&grid[r][c];if(t&&t.obst){
    const nx=clamp(x,c*T,c*T+T),ny=clamp(y,OY+r*T,OY+r*T+T);if((x-nx)**2+(y-ny)**2<rad*rad)return true}}
  return false;
}
function lay(t,team){if(team===0)TUT.laid++;t.state=1;t.owner=team;t.heat=0;t.wet=0;t.anim=0;
  const p=tc(t.c,t.r);for(let i=0;i<5;i++)parts.push({k:'dust',x:p.x+rnd(-15,15),y:p.y+rnd(-15,15),vx:rnd(-20,20),vy:rnd(-20,20),life:0.5,max:0.5,s:rnd(2,4)})}
function seal(t){t.state=2;t.heat=0;const p=tc(t.c,t.r);
  for(let i=0;i<4;i++)parts.push({k:'smoke',x:p.x+rnd(-12,12),y:p.y+rnd(-12,12),vx:rnd(-8,8),vy:rnd(-25,-8),life:1.2,max:1.2,s:rnd(5,9)});
  for(let i=0;i<6;i++)parts.push({k:'spark',x:p.x,y:p.y,vx:rnd(-90,90),vy:rnd(-90,90),life:0.4,max:0.4,s:2})}
function emitFlame(x,y,d,n){for(let i=0;i<n;i++){const a=Math.atan2(d.y,d.x)+rnd(-0.32,0.32),sp=rnd(160,260);
  parts.push({k:'fire',x:x+rnd(-2,2),y:y+rnd(-2,2),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(0.18,0.32),max:0.32,s:rnd(5,9)})}}
function tryLay(t){

  if(player.rollLeft<=0){if(player.rolls<=0){if(!G.noRollWarn||G.t-G.noRollWarn>2.5){say('Rotoli finiti! Raccogline altri','#ffd166');G.noRollWarn=G.t}return}
    player.rolls--;player.rollLeft=ROLL_LEN}

function update(dt){
  G.t+=dt;
  updateParts(dt);
  if(msg.life>0)msg.life-=dt;
  if(G.intro>0){G.intro-=dt;return}
  timeLeft-=dt;tutUpdate(dt);
  // player movement
  let mx=0,my=0;
  if(keys.ArrowLeft||keys.KeyA)mx-=1;if(keys.ArrowRight||keys.KeyD)mx+=1;
  if(keys.ArrowUp||keys.KeyW)my-=1;if(keys.ArrowDown||keys.KeyS)my+=1;
  if(joy.active){mx+=joy.dx;my+=joy.dy}
  let l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l;l=1}
  if(l>0.15){player.dir={x:mx/l,y:my/l};player.walk+=dt*12;
    const sp=165*(player.torch?0.6:1);const nx=player.x+mx*sp*dt,ny=player.y+my*sp*dt;
    if(!blocked(nx,player.y,14))player.x=nx;if(!blocked(player.x,ny,14))player.y=ny}
  const cur=tileAt(player.x,player.y);
  if(cur&&(player.auto||keys.KeyE||touchLay))tryLay(cur);
  // torch
  const want=keys.Space||touchTorch;
  if(want&&player.gas<=0&&(!G.gasWarn||G.t-G.gasWarn>2.5)){say('Bombola vuota! Prendi una bombola nuova','#ff6b6b');G.gasWarn=G.t}
  player.torch=want&&player.gas>0;
  if(player.torch){
    player.gas=Math.max(0,player.gas-dt*6.5);
    const d=player.dir,tip={x:player.x+d.x*26,y:player.y+d.y*26};emitFlame(tip.x,tip.y,d,3);
    const pc=Math.floor(player.x/T),pr=Math.floor((player.y-OY)/T);
    for(let r=pr-2;r<=pr+2;r++)for(let c=pc-2;c<=pc+2;c++){const t=grid[r]&&grid[r][c];if(!t||t.state!==1||t.owner!==0)continue;
      const p=tc(c,r),dx=p.x-player.x,dy=p.y-player.y,dd=Math.hypot(dx,dy);
      if(dd<34||(dd<82&&(dx*d.x+dy*d.y)/dd>0.68)){t.heat+=dt*3.2;
        if(Math.random()<0.25)parts.push({k:'smoke',x:p.x+rnd(-10,10),y:p.y+rnd(-10,10),vx:rnd(-6,6),vy:rnd(-20,-5),life:0.9,max:0.9,s:rnd(4,7)});
        if(t.heat>=1){seal(t);sizzle();TUT.sealed++;G.score+=10;popup(p.x,p.y-10,'+10',TEAMS[0].col)}}}
  }
  // pickups
  for(let i=pickups.length-1;i>=0;i--){const k=pickups[i];k.b+=dt*4;
    if(Math.hypot(k.x-player.x,k.y-player.y)<28){
      if(k.type==='roll'){if(player.rolls<MAX_ROLLS){player.rolls++;popup(k.x,k.y,'+1 rotolo','#ffd166');pickups.splice(i,1)}}
      else{player.gas=100;popup(k.x,k.y,'Bombola piena!','#8ecae6');pickups.splice(i,1)}}}
  spawnT.roll-=dt;if(spawnT.roll<=0){spawnT.roll=2.6;if(pickups.filter(p=>p.type==='roll').length<4)spawnPickup('roll')}
  if(!pickups.some(p=>p.type==='gas')){spawnT.gas-=dt;if(spawnT.gas<=0){spawnT.gas=4;spawnPickup('gas')}}
  // rivals
  rivals.forEach(rv=>updateRival(rv,dt));
  // rain
  spawnT.rain-=dt;
  if(spawnT.rain<=0){spawnT.rain=P.rainEvery+rnd(-2,3);
    const fromLeft=Math.random()<0.5,y=rnd(OY+60,OY+ROWS*T-60);
    clouds.push({x:fromLeft?-260:W+260,y,vx:(fromLeft?1:-1)*(P.cloudSpeed+rnd(0,20)),r:rnd(75,100),ph:Math.random()*9});
    say('Nuvola in arrivo! Sigilla la guaina!','#8ecae6')}
  for(let i=clouds.length-1;i>=0;i--){const cl=clouds[i];cl.x+=cl.vx*dt;cl.ph+=dt;
    if(cl.x<-320||cl.x>W+320){clouds.splice(i,1);continue}
    const c0=Math.floor((cl.x-cl.r)/T),c1=Math.floor((cl.x+cl.r)/T),r0=Math.floor((cl.y-OY-cl.r)/T),r1=Math.floor((cl.y-OY+cl.r)/T);
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const t=grid[r]&&grid[r][c];if(!t||t.state!==1)continue;
      const p=tc(c,r);if(Math.hypot(p.x-cl.x,p.y-cl.y)<cl.r){t.wet+=dt*1.6;
        if(t.wet>=1){if(t.owner===0){G.score=Math.max(0,G.score-15);popup(p.x,p.y,'Bagnata! -15','#8ecae6')}
          t.state=0;t.owner=-1;t.heat=0;t.wet=0}}}}
  grid.forEach(row=>row.forEach(t=>{if(t.anim<1)t.anim=Math.min(1,t.anim+dt*5);if(t.state===1&&t.wet>0&&!clouds.length)t.wet=Math.max(0,t.wet-dt*0.3)}));
  popups.forEach(p=>{p.life-=dt;p.y-=dt*30});popups=popups.filter(p=>p.life>0);

}
function updateRival(rv,dt){
  rv.torch=false;if(rv.bubbleT>0)rv.bubbleT-=dt;
  if(rv.st==='pause'){rv.timer-=dt;if(rv.timer<=0)rv.st='think';return}
  if(rv.st==='think'){
    let best=null,bd=1e9;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=grid[r][c];if(!coverable(t)||t.state!==0)continue;
      if(rivals.some(o=>o!==rv&&o.target===t))continue;
      const p=tc(c,r),d=Math.hypot(p.x-rv.x,p.y-rv.y)+Math.random()*50+Math.hypot(p.x-player.x,p.y-player.y)*0.08;if(d<bd){bd=d;best=t}}
    rv.target=best;rv.st=best?'move':'idle';return}
  if(rv.st==='idle'){rv.timer-=dt;if(rv.timer<=0){rv.timer=1;rv.st='think'}return}
  const t=rv.target,p=tc(t.c,t.r),dx=p.x-rv.x,dy=p.y-rv.y,d=Math.hypot(dx,dy);
  if(rv.st==='move'){

    if(d<30){if(d>1)rv.dir={x:dx/d,y:dy/d};lay(t,rv.team);rv.st='heat';rv.timer=P.sealTime;return}
    rv.dir={x:dx/d,y:dy/d};rv.walk+=dt*11;rv.x+=rv.dir.x*P.rivalSpeed*dt;rv.y+=rv.dir.y*P.rivalSpeed*dt;return}
  if(rv.st==='heat'){
    if(t.state!==1||t.owner!==rv.team){rv.st='think';return}
    rv.torch=true;rv.timer-=dt;t.heat=1-rv.timer/P.sealTime;
    emitFlame(rv.x+rv.dir.x*26,rv.y+rv.dir.y*26,rv.dir,2);
    if(Math.random()<0.1)parts.push({k:'smoke',x:p.x+rnd(-10,10),y:p.y+rnd(-10,10),vx:rnd(-6,6),vy:rnd(-20,-5),life:0.9,max:0.9,s:rnd(4,7)});
    if(rv.timer<=0){seal(t);rv.target=null;
      if(Math.random()<0.06){rv.st='pause';rv.timer=1.8;rv.bubble=['Pausa caffè!','Che caldo...','Mo\' arrivo!','Uff, la schiena'][Math.floor(Math.random()*4)];rv.bubbleT=1.8}
      else rv.st='think'}}
}
function updateParts(dt){for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='fire'){p.vx*=0.9;p.vy*=0.9}}

function endLevel(complete){

  let bonus=0;if(won){bonus=100*G.level+Math.max(0,Math.floor(timeLeft))*5+(complete?50:0)}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,col,align,stroke,weight){ctx.font=(weight||'bold')+' '+size+'px "Trebuchet MS",Verdana,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}

function drawGround(){
  ctx.fillStyle='#c9b994';ctx.fillRect(0,OY,W,ROWS*T);
  ctx.fillStyle='rgba(120,100,70,.12)';
  for(let i=0;i<120;i++){const x=(i*137)%W,y=OY+(i*251)%(ROWS*T);ctx.fillRect(x,y,3,3)}
  // vialetti
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.setLineDash([10,10]);
  ctx.beginPath();ctx.moveTo(0,OY+ROWS*T-20);ctx.lineTo(W,OY+ROWS*T-20);ctx.moveTo(0,OY+20);ctx.lineTo(W,OY+20);ctx.stroke();ctx.setLineDash([]);
  deco.forEach(d=>{if(d.k==='albero'){circle(d.x+5,d.y+6,15*d.s,'rgba(0,0,0,.18)');circle(d.x,d.y,15*d.s,'#5b7f3a');circle(d.x-4,d.y-4,10*d.s,'#7aa34f');circle(d.x+5,d.y-6,5*d.s,'#93bd63')}
    else{circle(d.x+3,d.y+3,9,'rgba(0,0,0,.2)');circle(d.x,d.y,9,'#c0663a');circle(d.x,d.y,6,'#6a9c3f');circle(d.x-2,d.y-2,2.5,'#e84a5f')}});
}
function drawRoofs(){
  roofs.forEach(R=>{const x=R.x*T,y=OY+R.y*T,w=R.w*T,h=R.h*T;
    ctx.fillStyle='rgba(40,30,20,.35)';ctx.fillRect(x+4,y+10,w+8,h+8);
    ctx.fillStyle='#f3ead7';ctx.fillRect(x-6,y-6,w+12,h+12);
    ctx.strokeStyle='#bfae8c';ctx.lineWidth=2;ctx.strokeRect(x-6,y-6,w+12,h+12);
    ctx.fillStyle='#a8a39a';ctx.fillRect(x,y,w,h)});
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=grid[r][c];if(!t.roof)continue;const x=c*T,y=OY+r*T;
    if(t.obst){drawObst(t,x,y);continue}
    if(t.state===0){ctx.fillStyle=t.v<0.5?'#aaa59b':'#a39e94';ctx.fillRect(x,y,T,T);ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,T-1,T-1);
      if(t.v>0.85){ctx.strokeStyle='rgba(60,50,40,.3)';ctx.beginPath();ctx.moveTo(x+8,y+12);ctx.lineTo(x+16,y+20);ctx.lineTo(x+14,y+28);ctx.stroke()}
      continue}
    const a=t.anim,sx=x+T/2*(1-a),sw=T*a;
    if(t.state===1){
      ctx.fillStyle='#6b5d50';ctx.fillRect(sx,y,sw,T);
      ctx.fillStyle='rgba(210,190,150,.35)';for(let k=0;k<4;k++)ctx.fillRect(sx,y+5+k*9,sw,2);
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(sx,y+T-4,sw,4);
      ctx.fillStyle=TEAMS[t.owner].col;ctx.fillRect(sx,y,sw,4);
      if(t.heat>0){ctx.fillStyle='rgba(255,'+Math.floor(140-80*t.heat)+',0,'+(0.25+0.45*t.heat)+')';ctx.fillRect(x,y,T,T)}
      if(t.wet>0){ctx.fillStyle='rgba(70,140,230,'+(0.5*t.wet)+')';ctx.fillRect(x,y,T,T)}
    }else{
      const g=ctx.createLinearGradient(x,y,x+T,y+T);g.addColorStop(0,'#2b2b30');g.addColorStop(0.5,'#141417');g.addColorStop(1,'#232327');
      ctx.fillStyle=g;ctx.fillRect(x,y,T,T);
      ctx.fillStyle='rgba(255,255,255,.13)';ctx.beginPath();ctx.moveTo(x+4,y+T-8);ctx.lineTo(x+T-8,y+4);ctx.lineTo(x+T-2,y+4);ctx.lineTo(x+4,y+T-2);ctx.fill();
      const sh=(Math.sin(G.t*2+c*0.7+r*0.5)+1)/2;ctx.fillStyle='rgba(255,255,255,'+(0.05+0.08*sh)+')';ctx.fillRect(x+6,y+6,6,3);
      ctx.strokeStyle=TEAMS[t.owner].col;ctx.globalAlpha=0.55;ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,T-4,T-4);ctx.globalAlpha=1;
      ctx.fillStyle=TEAMS[t.owner].col;ctx.beginPath();ctx.moveTo(x+T-12,y+T-2);ctx.lineTo(x+T-2,y+T-2);ctx.lineTo(x+T-2,y+T-12);ctx.fill();
    }}
}
function drawObst(t,x,y){
  if(t.obst===1){ // camino
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(x+8,y+10,T-6,T-6);
    ctx.fillStyle='#b5523b';ctx.fillRect(x+3,y+3,T-6,T-6);ctx.strokeStyle='#7d3322';ctx.lineWidth=1;
    for(let k=1;k<4;k++){ctx.beginPath();ctx.moveTo(x+3,y+3+k*8.5);ctx.lineTo(x+T-3,y+3+k*8.5);ctx.stroke()}
    ctx.fillStyle='#2a1a14';ctx.fillRect(x+11,y+11,T-22,T-22);
    if(Math.random()<0.05)parts.push({k:'smoke',x:x+T/2,y:y+T/2,vx:rnd(-5,5),vy:rnd(-18,-8),life:1.6,max:1.6,s:5});
  }else{ // lucernario
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(x+8,y+10,T-6,T-6);
    ctx.fillStyle='#dfe7ee';ctx.fillRect(x+3,y+3,T-6,T-6);
    const g=ctx.createLinearGradient(x,y,x+T,y+T);g.addColorStop(0,'#9fd3f0');g.addColorStop(1,'#3d7fb0');ctx.fillStyle=g;ctx.fillRect(x+7,y+7,T-14,T-14);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(x+10,y+9,4,T-20);
  }
}
function drawPickups(){pickups.forEach(drawPickup)}
function drawPickup(k){const bob=Math.sin(k.b)*3;
  ctx.save();ctx.translate(k.x,k.y);
  circle(0,8,14,'rgba(0,0,0,.2)');
  ctx.globalAlpha=0.35+0.2*Math.sin(k.b*1.5);circle(0,bob,22,k.type==='roll'?'#ffd166':'#8ecae6');ctx.globalAlpha=1;
  if(k.type==='roll'){
    ctx.fillStyle='#2a2522';rr(-16,-8+bob,30,16,4);ctx.fill();
    ctx.fillStyle='#4a413a';ctx.fillRect(-16,-4+bob,30,2);ctx.fillRect(-16,2+bob,30,2);
    circle(14,bob,8,'#3a332d');ctx.strokeStyle='#8a7b6a';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(14,bob,5,0,5);ctx.stroke();circle(14,bob,1.8,'#c9b994');
    txt('GUAINA',-2,-14+bob,9,'#fff','center',3);
  }else{
    ctx.fillStyle='#d62828';rr(-9,-14+bob,18,26,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-6,-10+bob,3,18);
    ctx.fillStyle='#777';ctx.fillRect(-4,-19+bob,8,6);ctx.fillStyle='#fff';ctx.fillRect(-9,-2+bob,18,5);
    txt('GPL',0,0.5+bob,7,'#d62828','center',0);
  }
  ctx.restore()}
function drawWorker(o,col,dark,isPlayer){
  const d=o.dir,x=o.x,y=o.y,bob=Math.sin(o.walk)*1.5,ang=Math.atan2(d.y,d.x);
  circle(x+4,y+6,17,'rgba(0,0,0,.25)');
  // bombola sulla schiena
  const bx=x-d.x*14,by=y-d.y*14;
  const tip={x:x+d.x*26,y:y+d.y*26};
  ctx.strokeStyle='#222';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(x-d.y*16,y+d.x*16,x+d.x*14-d.y*6,y+d.y*14+d.x*6);ctx.stroke();
  circle(bx,by,9,'#c1121f');circle(bx-2,by-2,4,'#e85d5d');circle(bx,by,2.5,'#888');
  ctx.save();ctx.translate(x,y+bob);ctx.rotate(ang);
  // feet
  const st=Math.sin(o.walk)*5;ctx.fillStyle='#3b2f2a';ctx.fillRect(-4+st,-11,9,5);ctx.fillRect(-4-st,6,9,5);
  // torch
  ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(4,6);ctx.lineTo(24,4);ctx.stroke();
  ctx.fillStyle='#b08d57';ctx.fillRect(6,3,7,6);ctx.fillStyle='#333';ctx.fillRect(22,1,5,6);
  // body
  ctx.beginPath();ctx.ellipse(0,0,11,14,0,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=dark;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(-2,-13,3,26);
  // arms
  circle(6,9,4,'#e0ac7e');circle(8,-8,4,'#e0ac7e');
  // helmet
  circle(1,0,8.5,isPlayer?'#ffd23f':'#f1f1f1');ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(1,0,8.5,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(-6,-1,13,2);
  ctx.restore();
  if(o.torch){ // blue core
    ctx.save();ctx.translate(tip.x,tip.y);ctx.rotate(ang);ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(4,0,1,4,0,14);g.addColorStop(0,'rgba(220,240,255,.95)');g.addColorStop(0.5,'rgba(80,140,255,.7)');g.addColorStop(1,'rgba(40,80,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(6,0,14,6,0,0,Math.PI*2);ctx.fill();ctx.restore()}
  if(isPlayer){txt('TU',x,y-26,11,'#fff','center',3)}
}
function drawParts(under){
  for(const p of parts){const t=p.life/p.max;
    if(p.k==='smoke'&&under){ctx.fillStyle='rgba(70,70,75,'+(0.35*t)+')';circle(p.x,p.y,p.s*(2-t),ctx.fillStyle)}
    else if(p.k==='dust'&&under){circle(p.x,p.y,p.s*t,'rgba(240,230,200,'+(0.6*t)+')')}}
  if(under)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of parts){const t=p.life/p.max;
    if(p.k==='fire'){const col=t>0.65?'255,245,190':t>0.4?'255,183,3':'251,86,7';circle(p.x,p.y,p.s*(0.4+t*0.8),'rgba('+col+','+Math.min(1,t*1.2)+')')}
    else if(p.k==='spark'){circle(p.x,p.y,p.s,'rgba(255,220,120,'+t+')')}}
  ctx.restore();
}
function drawClouds(){
  clouds.forEach(cl=>{
    circle(cl.x,cl.y,cl.r,'rgba(20,50,90,.22)');
    ctx.strokeStyle='rgba(170,210,255,.7)';ctx.lineWidth=1.5;ctx.beginPath();
    for(let i=0;i<45;i++){const a=(i*2.399)+cl.ph*0.3,rr2=cl.r*Math.sqrt(((i*0.618+cl.ph*1.7)%1));
      const x=cl.x+Math.cos(a)*rr2,y=cl.y+Math.sin(a)*rr2;ctx.moveTo(x,y);ctx.lineTo(x-3,y+9)}ctx.stroke();
    for(let i=0;i<8;i++){const a=i*1.7+cl.ph,rr2=cl.r*((i*0.37+cl.ph*0.9)%1);const x=cl.x+Math.cos(a)*rr2,y=cl.y+Math.sin(a)*rr2;
      ctx.strokeStyle='rgba(200,230,255,.6)';ctx.beginPath();ctx.ellipse(x,y,4,2,0,0,Math.PI*2);ctx.stroke()}
    const cx=cl.x-20,cy=cl.y-60;
    [[0,0,48],[-45,10,36],[45,8,38],[-20,-22,34],[25,-20,32],[-70,20,24],[72,18,24]].forEach(p=>circle(cx+p[0],cy+p[1]+6,p[2],'rgba(80,90,110,.75)'));
    [[0,0,46],[-45,8,34],[45,6,36],[-20,-24,32],[25,-22,30],[-70,18,22],[72,16,22]].forEach(p=>circle(cx+p[0],cy+p[1],p[2],'rgba(225,230,240,.92)'));
    if(cl.x<0||cl.x>W){const ex=cl.x<0?24:W-24;circle(ex,cl.y,18,'rgba(30,60,120,.8)');txt('!',ex,cl.y+1,22,'#fff')}
  });
}
function drawRival(rv){drawWorker(rv,TEAMS[rv.team].col,TEAMS[rv.team].dark,false);
  if(rv.bubbleT>0){ctx.font='bold 12px Verdana';const w=ctx.measureText(rv.bubble).width+14;ctx.fillStyle='#fff';rr(rv.x-w/2,rv.y-50,w,22,8);ctx.fill();
    ctx.beginPath();ctx.moveTo(rv.x-4,rv.y-28);ctx.lineTo(rv.x+4,rv.y-28);ctx.lineTo(rv.x,rv.y-22);ctx.fill();txt(rv.bubble,rv.x,rv.y-39,12,'#333','center',0)}}

function drawHUD(){
  const g=ctx.createLinearGradient(0,0,0,OY);g.addColorStop(0,'#24364a');g.addColorStop(1,'#182533');ctx.fillStyle=g;ctx.fillRect(0,0,W,OY);
  ctx.fillStyle='#ff8c1a';ctx.fillRect(0,OY-3,W,3);
  txt('LIVELLO '+G.level,14,20,17,'#ffd166','left');
  const tl=Math.max(0,Math.ceil(timeLeft)),warn=tl<=15&&Math.floor(G.t*3)%2===0;
  txt('TEMPO '+Math.floor(tl/60)+':'+String(tl%60).padStart(2,'0'),14,45,16,warn?'#ff6b6b':'#fff','left');
  txt('PUNTI '+G.score,150,20,17,'#fff','left');
  txt('RECORD '+G.best,150,45,13,'#9fb3c8','left');
  // gas
  const gx=290;ctx.fillStyle='#c1121f';rr(gx,10,14,24,5);ctx.fill();ctx.fillStyle='#888';ctx.fillRect(gx+4,6,6,5);
  txt('GAS',gx+7,48,11,'#fff');
  ctx.fillStyle='#0d151e';rr(gx+22,14,130,16,6);ctx.fill();
  const gp=player.gas/100;ctx.fillStyle=gp>0.5?'#52b788':gp>0.2?'#ffb703':'#e63946';rr(gx+24,16,Math.max(0,126*gp),12,5);ctx.fill();
  txt(Math.ceil(player.gas)+'%',gx+87,22,11,'#fff','center',2);
  txt(player.auto?'Stesura auto: ON':'Stesura auto: OFF',gx+87,47,11,player.auto?'#b7e4c7':'#ffadad');
  // rotoli
  const rx=470;txt('ROTOLI',rx,20,12,'#fff','left');
  for(let i=0;i<MAX_ROLLS;i++){const x=rx+58+i*16;ctx.fillStyle=i<player.rolls?'#2a2522':'rgba(255,255,255,.12)';rr(x,12,13,16,3);ctx.fill();
    if(i<player.rolls){circle(x+6.5,20,4,'#4a413a');circle(x+6.5,20,1.5,'#c9b994')}}
  txt('In uso:',rx,45,11,'#9fb3c8','left');ctx.fillStyle='#0d151e';rr(rx+46,39,100,10,4);ctx.fill();
  ctx.fillStyle='#ffd166';rr(rx+47,40,Math.max(0,98*player.rollLeft/ROLL_LEN),8,3);ctx.fill();
  // squadre
  const n=countTeams();let tx=624;
  txt('TETTO SIGILLATO',tx+((rivals.length+1)*53-3)/2,14,10,'#9fb3c8');
  for(let i=0;i<=rivals.length;i++){const x=tx+i*53;ctx.fillStyle=TEAMS[i].col;rr(x,24,50,30,7);ctx.fill();
    txt(i===0?'TU':TEAMS[i].name.split(' ')[1].toUpperCase(),x+25,32,9,'#fff','center',2);
    txt(Math.round(n[i]/coverTotal*100)+'%',x+25,46,14,'#fff','center',3)}
  const pb=BTN_PAUSE;ctx.fillStyle='rgba(255,255,255,.15)';rr(pb.x,pb.y,pb.w,pb.h,8);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(pb.x+10,pb.y+9,6,18);ctx.fillRect(pb.x+20,pb.y+9,6,18)
}
function drawTouch(){
  if(!touchMode)return;
  ctx.save();ctx.globalAlpha=0.55;
  const bx=joy.active?joy.bx:130,by=joy.active?joy.by:H-130;
  circle(bx,by,JOY_R,'rgba(255,255,255,.18)');ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(bx,by,JOY_R,0,7);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)';[[0,-1],[0,1],[-1,0],[1,0]].forEach(d=>{const ax=bx+d[0]*(JOY_R-16),ay=by+d[1]*(JOY_R-16);ctx.beginPath();ctx.moveTo(ax+d[0]*10,ay+d[1]*10);ctx.lineTo(ax-d[1]*9-d[0]*2,ay+d[0]*9-d[1]*2);ctx.lineTo(ax+d[1]*9-d[0]*2,ay-d[0]*9-d[1]*2);ctx.fill()});
  circle(bx+joy.dx*55,by+joy.dy*55,36,'rgba(255,255,255,.75)');
  if(!joy.active)txt('MUOVITI',bx,by-JOY_R-14,15,'#fff','center',3);
  ctx.globalAlpha=0.72;
  circle(BTN_TORCH.x,BTN_TORCH.y,BTN_TORCH.r,touchTorch?'rgba(255,120,20,.98)':'rgba(230,80,20,.85)');
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(BTN_TORCH.x,BTN_TORCH.y,BTN_TORCH.r,0,7);ctx.stroke();
  txt('CANNELLO',BTN_TORCH.x,BTN_TORCH.y+22,19,'#fff','center',4);
  txt('tieni premuto',BTN_TORCH.x,BTN_TORCH.y+44,11,'#fff','center',3);
  ctx.fillStyle='#ffd166';ctx.beginPath();ctx.moveTo(BTN_TORCH.x,BTN_TORCH.y-50);ctx.quadraticCurveTo(BTN_TORCH.x+22,BTN_TORCH.y-18,BTN_TORCH.x,BTN_TORCH.y-2);ctx.quadraticCurveTo(BTN_TORCH.x-22,BTN_TORCH.y-18,BTN_TORCH.x,BTN_TORCH.y-50);ctx.fill();
  ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.moveTo(BTN_TORCH.x,BTN_TORCH.y-30);ctx.quadraticCurveTo(BTN_TORCH.x+10,BTN_TORCH.y-14,BTN_TORCH.x,BTN_TORCH.y-6);ctx.quadraticCurveTo(BTN_TORCH.x-10,BTN_TORCH.y-14,BTN_TORCH.x,BTN_TORCH.y-30);ctx.fill();
  circle(BTN_AUTO.x,BTN_AUTO.y,BTN_AUTO.r,player.auto?'rgba(40,160,100,.9)':'rgba(120,120,120,.85)');
  txt('AUTO',BTN_AUTO.x,BTN_AUTO.y-9,15,'#fff','center',3);txt(player.auto?'ON':'OFF',BTN_AUTO.x,BTN_AUTO.y+11,15,'#fff','center',3);
  circle(BTN_LAY.x,BTN_LAY.y,BTN_LAY.r,touchLay?'rgba(255,209,102,.98)':'rgba(90,75,60,.9)');
  ctx.fillStyle='#2a2522';rr(BTN_LAY.x-22,BTN_LAY.y-26,44,16,4);ctx.fill();circle(BTN_LAY.x+22,BTN_LAY.y-18,8,'#3a332d');
  txt('STENDI',BTN_LAY.x,BTN_LAY.y+12,16,'#fff','center',3);
  ctx.restore();
}
function drawGame(){
  drawGround();drawRoofs();drawParts(true);drawPickups();
  rivals.forEach(drawRival);drawWorker(player,TEAMS[0].col,TEAMS[0].dark,true);
  drawParts(false);drawClouds();
  popups.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life*2);txt(p.text,p.x,p.y,15,p.col,'center',3);ctx.globalAlpha=1});
  drawWorldLogo();drawHUD();drawTouch();drawTutorial();
  if(msg.life>0){ctx.globalAlpha=Math.min(1,msg.life*2);ctx.fillStyle='rgba(0,0,0,.55)';ctx.font='bold 18px Verdana';const w=ctx.measureText(msg.text).width+40;
    rr(W/2-w/2,OY+12,w,34,12);ctx.fill();txt(msg.text,W/2,OY+30,18,msg.col);ctx.globalAlpha=1}
  if(G.intro>0){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,OY,W,H-OY);
    txt('LIVELLO '+G.level,W/2,H/2-50,40,'#ffd166','center',6);
    txt(G.intro>0.7?'Pronti... accendi il cannello!':'VIA!',W/2,H/2+10,G.intro>0.7?28:54,'#fff','center',6);
    txt(P.rivals===1?'1 ditta rivale':P.rivals+' ditte rivali',W/2,H/2+60,18,'#ffadad','center',4)}
}
function logoCard(x,y,h,center){if(!LOGO.complete||!LOGO.naturalWidth)return 0;const w=h*LOGO.naturalWidth/LOGO.naturalHeight,px=center?x-w/2:x;
  ctx.fillStyle='#fff';rr(px-6,y-4,w+12,h+8,7);ctx.fill();ctx.drawImage(LOGO,px,y,w,h);return w+12}
function drawWorldLogo(){ctx.save();ctx.globalAlpha=0.92;logoCard(10,OY+8,22,false);ctx.restore()}
function creditBar(t){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,H-30,W,30);const lw=logoCard(14,H-25,20,false);txt(t,W/2+lw/2,H-15,12,'#fff')}
function ticketBtn(r,big){const pul=1+0.025*Math.sin(G.t*6);ctx.save();ctx.translate(r.x+r.w/2,r.y+r.h/2);ctx.scale(pul,pul);

let last=performance.now();
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000);last=now;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(G.endDelay>0)G.endDelay-=dt;
  if(G.state==='play'){update(dt);drawGame()}
  else{G.t+=dt;
    if(G.state==='menu')drawMenu();
    else if(G.state==='pause'){drawGame();ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);txt('PAUSA',W/2,H/2-20,56,'#ffd166','center',8);txt(touchMode?'Tocca per riprendere':'Premi P o INVIO per riprendere',W/2,H/2+35,18,'#fff')}
    else if(G.state==='levelEnd')drawEnd();
    else if(G.state==='gameover')drawFinal(false);
    else if(G.state==='victory')drawFinal(true);}
  drawMuteBtn();drawFsBtn();audioFrame();
  requestAnimationFrame(frame);
}
